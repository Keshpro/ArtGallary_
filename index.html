<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggrani Karunarathna | Coming Soon</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --gold-accent: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* ── GRAIN OVERLAY ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0;
            z-index: -10;
        }

        .cursor {
            width: 30px; height: 30px;
            border: 1px solid var(--gold-accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            transition: transform 0.15s ease-out;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            width: 6px; height: 6px;
            background: var(--gold-accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 99999;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            padding: 40px;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .brand-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-accent);
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 300;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        h1 em {
            font-style: italic;
            color: var(--gold-accent);
        }

        p.subtitle {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-muted);
            letter-spacing: 2px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 40px;
            text-transform: uppercase;
        }

        .cute-message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-style: italic;
            color: #e0e0e0;
            margin-bottom: 30px;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* ── COUNTDOWN ── */
        .countdown-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid var(--gold-border, rgba(212, 175, 55, 0.3));
            backdrop-filter: blur(5px);
            border-radius: 8px;
            width: 90px;
            height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .time-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.2);
            border-color: var(--gold-accent);
        }

        .time-box span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--gold-accent);
            line-height: 1;
            margin-bottom: 5px;
        }

        .time-box p {
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 0;
        }

        .contact-info {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .contact-info a {
            color: var(--gold-accent);
            text-decoration: none;
            transition: color 0.3s;
            cursor: none;
        }

        .contact-info a:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .cursor, .cursor-dot { display: none; }
            * { cursor: auto !important; }
            .time-box { width: 75px; height: 75px; }
            .time-box span { font-size: 2rem; }
            .countdown-wrapper { gap: 10px; }
        }
    </style>
</head>

<body>

    <div id="particles-js"></div>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <div class="container">
        <span class="brand-name">Aggrani Karunarathna</span>
        
        <h1>A New Canvas<br><em>Awaits</em></h1>
        
        <p class="subtitle">We are quietly mixing new colors and preparing an updated portfolio experience.</p>
        
        <div class="cute-message">✨ Preparing the magic... 🎨</div>

        <div class="countdown-wrapper">
            <div class="time-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Mins</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Secs</p>
            </div>
        </div>

        <div class="contact-info">
            In the meantime, reach out at <a href="www.instagram.com">Instagram</a>
            <br><br>
            <span style="font-size:0.6rem; opacity:0.6; display:inline-block; margin-top:15px;">© 2026 KESHAN PANDITHARATHNA</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Custom Cursor Logic
        const cursor = document.getElementById("cursor");
        const cursorDot = document.getElementById("cursor-dot");
        document.addEventListener("mousemove", (e) => {
            cursorDot.style.left = e.clientX + "px";
            cursorDot.style.top = e.clientY + "px";
            cursor.animate({ left: e.clientX + "px", top: e.clientY + "px" }, { duration: 500, fill: "forwards" });
        });

        // Particles Logic
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 300, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#d4af37" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3, "random": true, "anim": { "enable": true, "speed": 0.5, "opacity_min": 0.1, "sync": false } },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 0.3, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "bubble" }, "onclick": { "enable": false }, "resize": true },
                "modes": { "bubble": { "distance": 200, "size": 3, "duration": 2, "opacity": 0.8, "speed": 3 } }
            },
            "retina_detect": true
        });

        // Countdown Logic
        // Set target date to June 23, 2026 00:00:00
        const targetDate = new Date("June 23, 2026 00:00:00").getTime();

        const updateCountdown = setInterval(function() {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;

            // Calculate days, hours, minutes, seconds
            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            // Output the result in elements, add leading zero if needed
            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // If the countdown is over, display something else
            if (timeLeft < 0) {
                clearInterval(updateCountdown);
                document.querySelector(".countdown-wrapper").innerHTML = "<div class='cute-message'>The wait is over! Refreshing soon... ✨</div>";
            }
        }, 1000);
    </script>
</body>

</html>
